name: Deploy to AWS CodeDeploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: saneb-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
  AWS_CODEDEPLOY_APPLICATION: ${{ vars.AWS_CODEDEPLOY_APPLICATION }}
  AWS_CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.AWS_CODEDEPLOY_DEPLOYMENT_GROUP }}
  AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_REGION AWS_DEPLOY_BUCKET AWS_CODEDEPLOY_APPLICATION AWS_CODEDEPLOY_DEPLOYMENT_GROUP AWS_GITHUB_ACTIONS_ROLE_ARN; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub repository variables:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build boot jar
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bootJar --no-daemon --console=plain

      - name: Build CodeDeploy bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="build/codedeploy"
          rm -rf "${bundle_dir}"
          mkdir -p "${bundle_dir}/scripts/operations"

          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | head -n 1)"
          if [ -z "${jar_file}" ]; then
            echo "No executable Spring Boot jar found under build/libs."
            exit 1
          fi

          cp "${jar_file}" "${bundle_dir}/app.jar"
          cp appspec.yml "${bundle_dir}/appspec.yml"
          cp scripts/start.sh scripts/stop.sh scripts/validate.sh "${bundle_dir}/scripts/"
          cp scripts/operations/*.sh scripts/operations/*.sql "${bundle_dir}/scripts/operations/"
          chmod +x "${bundle_dir}/scripts/"*.sh
          chmod +x "${bundle_dir}/scripts/operations/"*.sh

          (
            cd "${bundle_dir}"
            zip -r "../saneb-${GITHUB_SHA}.zip" app.jar appspec.yml scripts
          )

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle to S3
        shell: bash
        run: |
          set -euo pipefail
          artifact_key="deployments/${GITHUB_REPOSITORY}/${GITHUB_SHA}.zip"
          echo "ARTIFACT_KEY=${artifact_key}" >> "${GITHUB_ENV}"
          aws s3 cp "build/saneb-${GITHUB_SHA}.zip" "s3://${AWS_DEPLOY_BUCKET}/${artifact_key}"

      - name: Create and wait for CodeDeploy deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="$(
            aws deploy create-deployment \
              --application-name "${AWS_CODEDEPLOY_APPLICATION}" \
              --deployment-group-name "${AWS_CODEDEPLOY_DEPLOYMENT_GROUP}" \
              --deployment-config-name CodeDeployDefault.AllAtOnce \
              --description "GitHub Actions ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
              --s3-location bucket="${AWS_DEPLOY_BUCKET}",key="${ARTIFACT_KEY}",bundleType=zip \
              --file-exists-behavior OVERWRITE \
              --query 'deploymentId' \
              --output text
          )"

          echo "DEPLOYMENT_ID=${deployment_id}"
          if ! aws deploy wait deployment-successful --deployment-id "${deployment_id}"; then
            echo "CodeDeploy deployment failed or timed out."
            aws deploy get-deployment --deployment-id "${deployment_id}" --output table || true
            aws deploy list-deployment-instances --deployment-id "${deployment_id}" --output table || true
            exit 1
          fi

          aws deploy get-deployment \
            --deployment-id "${deployment_id}" \
            --query 'deploymentInfo.{Status:status,CompleteTime:completeTime,Revision:revision.s3Location.key}' \
            --output table
