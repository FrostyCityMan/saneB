name: Diagnose AWS CodeDeploy

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "확인할 CodeDeploy 배포 ID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

jobs:
  diagnose:
    name: Read-only deployment diagnosis
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_REGION:-}"
          test -n "${AWS_GITHUB_ACTIONS_ROLE_ARN:-}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect deployment and rollback
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail

          echo "Deployment summary"
          aws deploy get-deployment \
            --deployment-id "${DEPLOYMENT_ID}" \
            --query 'deploymentInfo.{DeploymentId:deploymentId,Status:status,ErrorCode:errorInformation.code,RollbackDeploymentId:rollbackInfo.rollbackDeploymentId}' \
            --output json

          mapfile -t instance_ids < <(
            aws deploy list-deployment-instances \
              --deployment-id "${DEPLOYMENT_ID}" \
              --query 'instancesList[]' \
              --output text \
            | tr '\t' '\n'
          )

          for instance_id in "${instance_ids[@]}"; do
            if [ -z "${instance_id}" ]; then
              continue
            fi

            echo "Instance lifecycle summary"
            aws deploy get-deployment-instance \
              --deployment-id "${DEPLOYMENT_ID}" \
              --instance-id "${instance_id}" \
              --query 'instanceSummary.{Status:status,LifecycleEvents:lifecycleEvents[*].{Name:lifecycleEventName,Status:status,Code:diagnostics.errorCode}}' \
              --output json

            encoded_log_tail="$(
              aws deploy get-deployment-instance \
                --deployment-id "${DEPLOYMENT_ID}" \
                --instance-id "${instance_id}" \
                --query "instanceSummary.lifecycleEvents[?lifecycleEventName=='ValidateService'].diagnostics.logTail | [0]" \
                --output text
            )"
            decoded_log_tail="$(printf '%s' "${encoded_log_tail}" | base64 --decode 2>/dev/null || printf '%s' "${encoded_log_tail}")"
            derived_reason="UNKNOWN"

            if [[ "${decoded_log_tail}" == *"V68 cannot enforce one announcement link per source"* ]]; then
              derived_reason="V68_DUPLICATE_SOURCE_LINKS"
            elif [[ "${decoded_log_tail}" == *"Flyway"* || "${decoded_log_tail}" == *"Migration"* ]]; then
              derived_reason="FLYWAY_MIGRATION_FAILED"
            elif [[ "${decoded_log_tail}" == *"Health check failed"* ]]; then
              derived_reason="HEALTH_TIMEOUT"
            fi

            echo "DERIVED_FAILURE_REASON=${derived_reason}"
            unset encoded_log_tail decoded_log_tail
          done

          rollback_id="$(
            aws deploy get-deployment \
              --deployment-id "${DEPLOYMENT_ID}" \
              --query 'deploymentInfo.rollbackInfo.rollbackDeploymentId' \
              --output text
          )"

          if [ -n "${rollback_id}" ] && [ "${rollback_id}" != "None" ]; then
            echo "Rollback deployment summary"
            aws deploy get-deployment \
              --deployment-id "${rollback_id}" \
              --query 'deploymentInfo.{DeploymentId:deploymentId,Status:status,ErrorCode:errorInformation.code,CompleteTime:completeTime}' \
              --output json
          fi
