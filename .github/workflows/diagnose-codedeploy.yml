name: Diagnose AWS CodeDeploy

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "확인할 CodeDeploy 배포 ID"
        required: true
        type: string
      ssm_app_log_check:
        description: "SSM으로 애플리케이션 로그의 안전한 원인 코드만 판정"
        required: true
        default: false
        type: boolean
      ssm_attachment_qa_check:
        description: "SSM으로 해당 배포의 첨부 QA 요약만 조회"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

jobs:
  diagnose:
    name: Read-only deployment diagnosis
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_REGION:-}"
          test -n "${AWS_GITHUB_ACTIONS_ROLE_ARN:-}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect deployment and rollback
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail

          echo "Deployment summary"
          aws deploy get-deployment \
            --deployment-id "${DEPLOYMENT_ID}" \
            --query 'deploymentInfo.{DeploymentId:deploymentId,Status:status,ErrorCode:errorInformation.code,RollbackDeploymentId:rollbackInfo.rollbackDeploymentId}' \
            --output json

          mapfile -t instance_ids < <(
            aws deploy list-deployment-instances \
              --deployment-id "${DEPLOYMENT_ID}" \
              --query 'instancesList[]' \
              --output text \
            | tr '\t' '\n'
          )

          for instance_id in "${instance_ids[@]}"; do
            if [ -z "${instance_id}" ]; then
              continue
            fi

            echo "Instance lifecycle summary"
            aws deploy get-deployment-instance \
              --deployment-id "${DEPLOYMENT_ID}" \
              --instance-id "${instance_id}" \
              --query 'instanceSummary.{Status:status,LifecycleEvents:lifecycleEvents[*].{Name:lifecycleEventName,Status:status,Code:diagnostics.errorCode,Script:diagnostics.scriptName}}' \
              --output json

            diagnostics_log_tail="$(
              aws deploy get-deployment-instance \
                --deployment-id "${DEPLOYMENT_ID}" \
                --instance-id "${instance_id}" \
                --query "instanceSummary.lifecycleEvents[?lifecycleEventName=='ValidateService'].diagnostics.logTail | [0]" \
                --output text
            )"
            derived_reason="UNKNOWN"

            if [[ "${diagnostics_log_tail}" == *"V68 cannot enforce one announcement link per source"* ]]; then
              derived_reason="V68_DUPLICATE_SOURCE_LINKS"
            elif [[ "${diagnostics_log_tail}" == *"Flyway"* || "${diagnostics_log_tail}" == *"Migration"* ]]; then
              derived_reason="FLYWAY_MIGRATION_FAILED"
            elif [[ "${diagnostics_log_tail}" == *"Health check failed"* ]]; then
              derived_reason="HEALTH_TIMEOUT"
            fi

            echo "DERIVED_FAILURE_REASON=${derived_reason}"
            # CodeDeploy 실패 진단에서도 원문을 내보내지 않고 고정된 QA 상태만 식별한다.
            for marker in ATTACHMENT_SERVER_QA_SETUP_FAILED ATTACHMENT_SERVER_QA_SUMMARY ATTACHMENT_SERVER_QA= QA_ENVIRONMENT_INVALID ISOLATION_UNAVAILABLE; do
              if [[ "${diagnostics_log_tail}" == *"${marker}"* ]]; then
                echo "ATTACHMENT_DIAGNOSTIC_MARKER=${marker}"
              fi
            done
            unset diagnostics_log_tail
          done

          rollback_id="$(
            aws deploy get-deployment \
              --deployment-id "${DEPLOYMENT_ID}" \
              --query 'deploymentInfo.rollbackInfo.rollbackDeploymentId' \
              --output text
          )"

          if [ -n "${rollback_id}" ] && [ "${rollback_id}" != "None" ]; then
            echo "Rollback deployment summary"
            aws deploy get-deployment \
              --deployment-id "${rollback_id}" \
              --query 'deploymentInfo.{DeploymentId:deploymentId,Status:status,ErrorCode:errorInformation.code,CompleteTime:completeTime}' \
              --output json
          fi

      - name: Classify application startup failure through SSM
        if: ${{ inputs.ssm_app_log_check }}
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail

          instance_id="$(
            aws deploy list-deployment-instances \
              --deployment-id "${DEPLOYMENT_ID}" \
              --query 'instancesList[0]' \
              --output text
          )"
          if [ -z "${instance_id}" ] || [ "${instance_id}" = "None" ]; then
            echo "SSM_DERIVED_FAILURE_REASON=INSTANCE_NOT_FOUND"
            exit 1
          fi

          classifier_command="$(cat <<'COMMAND'
          set -eu
          log_file='/home/ubuntu/app/app.log'
          reason='UNKNOWN'

          if [ ! -r "${log_file}" ]; then
            reason='APP_LOG_UNAVAILABLE'
          elif grep -Fq 'V68 cannot enforce one announcement link per source' "${log_file}"; then
            reason='V68_DUPLICATE_SOURCE_LINKS'
          elif grep -Eiq 'org\.flywaydb|Flyway.*(failed|exception)|Migration.*failed' "${log_file}"; then
            reason='FLYWAY_MIGRATION_FAILED'
          elif grep -Eiq 'PSQLException|Connection.*refused|database.*unavailable' "${log_file}"; then
            reason='DATABASE_UNAVAILABLE'
          elif grep -Fq 'APPLICATION FAILED TO START' "${log_file}"; then
            reason='APP_START_FAILED'
          fi

          printf '%s\n' "${reason}"
          COMMAND
          )"
          parameters_json="$(jq -cn --arg command "${classifier_command}" '{commands:[$command]}')"
          command_id="$(
            aws ssm send-command \
              --instance-ids "${instance_id}" \
              --document-name 'AWS-RunShellScript' \
              --comment 'saneB read-only startup failure classification' \
              --parameters "${parameters_json}" \
              --query 'Command.CommandId' \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${instance_id}"

          derived_reason="$(
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${instance_id}" \
              --query 'StandardOutputContent' \
              --output text
          )"
          derived_reason="${derived_reason//$'\r'/}"
          derived_reason="${derived_reason//$'\n'/}"

          case "${derived_reason}" in
            V68_DUPLICATE_SOURCE_LINKS|FLYWAY_MIGRATION_FAILED|DATABASE_UNAVAILABLE|APP_START_FAILED|APP_LOG_UNAVAILABLE|UNKNOWN)
              echo "SSM_DERIVED_FAILURE_REASON=${derived_reason}"
              ;;
            *)
              echo "SSM_DERIVED_FAILURE_REASON=UNKNOWN"
              exit 1
              ;;
          esac

      - name: Read attachment QA summary through SSM
        if: ${{ inputs.ssm_attachment_qa_check }}
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          [[ "${DEPLOYMENT_ID}" =~ ^d-[A-Z0-9]+$ ]]
          instance_id="$(aws deploy list-deployment-instances --deployment-id "${DEPLOYMENT_ID}" --query 'instancesList[0]' --output text)"
          [[ "${instance_id}" =~ ^i-[a-f0-9]+$ ]]
          reader="$(cat <<'COMMAND'
          python3 - <<'PY'
          import glob, json, os, re
          deployment_id = '__DEPLOYMENT_ID__'
          paths = glob.glob('/opt/codedeploy-agent/deployment-root/*/' + deployment_id + '/logs/scripts.log')
          keys = {'caseId','checkedAt','ruleSource','ruleHash','ruleReleaseCode','evaluationScope',
                  'entireNoticeAttachmentSetVerified','productionWriteCount','passed','titleStage','bytes',
                  'binarySha256','quality','format','characterCount','textSha256','blockCount',
                  'containsSmallBusinessKeyword','status','reason','warningCodes','matchCount',
                  'failedStage','errorType','originalFilesRemoved','samples','failures'}
          found = 0
          for path in paths:
              if os.path.getsize(path) > 4 * 1024 * 1024:
                  continue
              with open(path, encoding='utf-8', errors='replace') as log:
                  for line in log:
                      match = re.search(r'ATTACHMENT_SERVER_QA(?:_SUMMARY)?=(\{[^\r\n]+\})', line)
                      if not match:
                          continue
                      try:
                          data = json.loads(match.group(1))
                          safe = {k:v for k,v in data.items() if k in keys}
                          print('ATTACHMENT_QA_RESULT=' + json.dumps(safe, ensure_ascii=True))
                          found += 1
                      except (ValueError, AttributeError):
                          pass
          if not found:
              print('ATTACHMENT_QA_RESULT=NOT_FOUND')
          PY
          COMMAND
          )"
          reader="${reader/__DEPLOYMENT_ID__/${DEPLOYMENT_ID}}"
          parameters="$(jq -cn --arg command "${reader}" '{commands:[$command],executionTimeout:["30"]}')"
          command_id="$(aws ssm send-command --instance-ids "${instance_id}" --document-name AWS-RunShellScript --comment 'saneB attachment QA summary read only' --parameters "${parameters}" --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${instance_id}"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${instance_id}" --query StandardOutputContent --output text
