name: 첨부 DB·작업 계약 Linux QA

'on':
  workflow_dispatch:
    inputs:
      observe-official-files:
        description: '고정 기업마당 3공고 전체 파일 관측 (기대값 승인·배포 없음)'
        type: boolean
        default: false
      observe-bbs-official-files:
        description: '태백 고정 1공고 제목·본문·전체 첨부 관측 (44요청/80MiB, 운영 쓰기 없음)'
        type: boolean
        default: false
      observe-yangpyeong-official-files:
        description: '양평 고정 3공고의 제목·본문·전체 첨부 관측 (전체132요청/240MiB, 운영 쓰기 없음)'
        type: boolean
        default: false
      observe-jecheon-official-files:
        description: '제천 고정 3공고의 제목 판정과 통과 공고 전체 첨부 관측 (최대132요청/240MiB, 운영 쓰기 없음)'
        type: boolean
        default: false
      observe-chungju-official-files:
        description: '충주 고정 3공고의 제목 판정과 통과 공고 전체 첨부 관측 (최대132요청/240MiB, 운영 쓰기 없음)'
        type: boolean
        default: false
      verify-bbs-fixed-case:
        description: '태백의 사전 고정 전체 파일 기대값 비교 (44요청/80MiB, 운영 쓰기 없음)'
        type: boolean
        default: false
      verify-official-worker:
        description: '양평 고정3건 실제 worker·임시 DB·API 검증 (132요청/240MiB, 운영 쓰기 없음)'
        type: boolean
        default: false
      verify-taebaek-hwp-worker:
        description: '태백 고정 HWP1건 최신 추출기·worker·임시 DB·API 검증 (44요청/80MiB, 배포·운영 쓰기 없음)'
        type: boolean
        default: false
      verify-jecheon-worker:
        description: '제천 고정3건 실제 worker·임시 DB·API 검증 (132요청/240MiB, 배포·운영 쓰기 없음)'
        type: boolean
        default: false
      verify-boeun-worker:
        description: '보은 고정3건 실제 worker·임시 DB·API 검증 (132요청/240MiB, 배포·운영 쓰기 없음)'
        type: boolean
        default: false
  # 기본 브랜치·운영 배포와 분리한 장기 goal 검증 브랜치만 자동 실행한다.
  push:
    branches:
      - codex/attachment-three-stage-linux-qa

permissions:
  contents: read

concurrency:
  group: saneb-attachment-contract-qa
  cancel-in-progress: false

jobs:
  contracts:
    name: 격리 PostgreSQL 계약 검증 — 배포 없음
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SANEB_ATTACHMENT_REAL_FILE_QA: 'false'
      SANEB_ATTACHMENT_RULE_EXPORT: 'false'
      SANEB_FLYWAY_INTEGRATION: 'false'
      SANEB_ANNOUNCEMENT_ATTACHMENT_WORKER_ENABLED: 'false'
      SANEB_ATTACHMENT_OFFICIAL_OBSERVATION: 'false'
      SANEB_ATTACHMENT_BBS_OFFICIAL_OBSERVATION: 'false'
      SANEB_ATTACHMENT_BBS_FIXED_CASE_QA: 'false'
      SANEB_ATTACHMENT_OFFICIAL_WORKER_QA: 'false'
    steps:
      - name: 소스 확인
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 관리자 화면 계약·상호작용·보고서 판정기 검증
        run: node --test scripts/qa/attachment-backfill-ui.test.mjs scripts/qa/attachment-batch-ui.test.mjs scripts/qa/attachment-recovery-ui.test.mjs scripts/qa/attachment-review-ui.test.mjs scripts/qa/attachment-operations-ui.test.mjs scripts/qa/attachment-policy-ui.test.mjs scripts/qa/attachment-provider-coverage-ui.test.mjs scripts/qa/attachment-provider-qa-ui.test.mjs scripts/qa/attachment-queue-ui.test.mjs scripts/qa/attachment-contract-report.test.mjs scripts/qa/attachment-taebaek-hwp-report.test.mjs scripts/qa/attachment-jecheon-observation-report.test.mjs scripts/qa/attachment-chungju-observation-report.test.mjs

      - name: 임시 runner 격리 도구 준비
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          test -x /usr/bin/bwrap
          test -x /usr/bin/prlimit

      - name: 제천 worker 전체 보고서 판정기 검증
        run: node --test scripts/qa/attachment-jecheon-worker-report.test.mjs

      - name: 보은 worker 판정기 단위 검증
        run: node --test scripts/qa/attachment-boeun-worker-report.test.mjs

      - name: 옥천 세 단계 관측 판정기 단위 검증
        run: node --test scripts/qa/attachment-okcheon-observation-report.test.mjs

      - name: 고정 DNS 진단기 단위 검증 — 외부 조회 없음
        run: node --test scripts/qa/attachment-dns-diagnostic.test.mjs

      - name: 명시한 보은·제천 DNS 비교 — 공고 요청·운영 쓰기 없음
        id: provider-dns-diagnostic
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[boeun-dns-diagnostic]') }}
        timeout-minutes: 3
        env:
          SANEB_ATTACHMENT_DNS_DIAGNOSTIC: 'true'
        run: node scripts/qa/attachment-dns-diagnostic.mjs

      - name: 고정 DNS 비교 metadata 보관 — 주소 원문 없음
        if: ${{ always() && steps.provider-dns-diagnostic.outcome != 'skipped' && steps.provider-dns-diagnostic.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-dns-diagnostic-${{ github.sha }}
          path: build/reports/attachment-dns-diagnostic/result.json
          if-no-files-found: error
          retention-days: 7

      - name: 배포 QA 패키지 불변 설치·JAR 원복 경로 검증
        run: node --test scripts/qa/attachment-contract-release.test.mjs scripts/qa/attachment-official-worker-probe.test.mjs scripts/qa/attachment-bbs-observation-probe.test.mjs

      - name: 임시 관측 실행기 경로·오류 metadata 회귀 검증 — 외부 요청 없음
        run: python3 -B -m unittest discover -s scripts/qa -p test_temporary_bbs_observation.py -v

      - name: 변경 코드의 태백 고정 공고 관측 — 기대값 승인·운영 쓰기 없음
        id: taebaek-revalidation-observation
        # 프로필 코드 변경은 기존 기대값을 무효화한다. 새 관측 없이 지문을 치환하거나
        # catalog 회귀 검사를 완화하지 않도록, 명시 표식에 한해 고정1건을 먼저 관측한다.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[taebaek-revalidation-observation]') }}
        timeout-minutes: 10
        run: bash ./gradlew attachmentBbsOfficialFileObservation -PsanebBbsObservationGroup=TAEBAEK --no-daemon --console=plain --max-workers=1

      - name: 태백 변경 코드 관측 metadata 보관 — 원문 없음
        if: ${{ always() && steps.taebaek-revalidation-observation.outcome != 'skipped' && steps.taebaek-revalidation-observation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-taebaek-revalidation-observation-${{ github.sha }}
          path: |
            build/reports/attachment-bbs-official-observation/TAEBAEK-184816.json
            build/test-results/attachmentBbsOfficialFileObservation/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 단위·HTTP·실제 임시 DB·migration·artifact 검증
        id: contracts
        # 앞선 명시적 외부 관측 실패와 코드/DB 계약 결과를 분리한다. 전체 job 실패는 보존한다.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'ATTACHMENT_QA_STARTED_AT=%s\n' "$(date +%s%3N)" >> "$GITHUB_ENV"
          bash ./gradlew :test :attachment-extractor:test attachmentContractQaTest attachmentJobIntegrationTest attachmentMigrationTest attachmentRuntimeIntegrationTest attachmentWorkerIntegrationTest flywayIntegrationTest -PsanebFlywayEphemeral=true bootJar :attachment-extractor:installDist installAttachmentContractQa --rerun-tasks --no-daemon --console=plain --max-workers=1 --continue

      - name: 독립 산출물의 임시 namespace·PostgreSQL 실행
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        run: bash build/install/attachment-contract-qa/bin/run-attachment-contract-qa.sh

      - name: 정책 부모의 실제 DB QA 연결·취소·정리 검증
        # 산출물 생성이 성공했으면 독립 실행의 실패와 별개로 연결 오류를 수집한다. 실패를 무시하지 않는다.
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        run: bash scripts/qa/run-policy-db-qa-isolated-user.sh

      - name: 필수 DB 테스트 누락·생략·실패 차단
        if: always()
        run: node scripts/qa/attachment-contract-report.mjs

      - name: 명시한 공식 공고 전체 첨부 관측 — 정책 검증·배포 아님
        id: official-observation
        # 일반 push에서는 공개 사이트를 호출하지 않는다. QA 브랜치의 명시 표식 또는 수동 입력만 허용한다.
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.observe-official-files == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[official-file-observation]'))) }}
        run: bash ./gradlew attachmentOfficialFileObservation --no-daemon --console=plain --max-workers=1

      - name: 공식 파일 관측 metadata 보관 — 원문 없음
        if: ${{ always() && steps.official-observation.outcome != 'skipped' && steps.official-observation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-official-observation-${{ github.sha }}
          path: |
            build/reports/attachment-official-observation/BIZINFO-SEMAS-2026.json
            build/reports/attachment-official-observation/BIZINFO-ANYANG-2026.json
            build/reports/attachment-official-observation/BIZINFO-SDM-2026.json
            build/test-results/attachmentOfficialFileObservation/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 태백 고정 공고 제목·본문·전체 첨부 관측 — 운영 쓰기 없음
        id: bbs-official-observation
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.observe-bbs-official-files == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[official-bbs-observation]'))) }}
        run: bash ./gradlew attachmentBbsOfficialFileObservation --no-daemon --console=plain --max-workers=1

      - name: 태백 세 단계 관측 metadata 보관 — 원문 없음
        if: ${{ always() && steps.bbs-official-observation.outcome != 'skipped' && steps.bbs-official-observation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-bbs-official-observation-${{ github.sha }}
          path: |
            build/reports/attachment-bbs-official-observation/TAEBAEK-184816.json
            build/test-results/attachmentBbsOfficialFileObservation/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 사전 검토한 태백 전체 파일 기대값 재검증 — 운영 쓰기 없음
        id: bbs-fixed-case-qa
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.verify-bbs-fixed-case == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fixed-bbs-qa]'))) }}
        run: bash ./gradlew attachmentBbsFixedCaseQa --no-daemon --console=plain --max-workers=1

      - name: 태백 고정 전체 파일 검증 metadata 보관 — 원문 없음
        if: ${{ always() && steps.bbs-fixed-case-qa.outcome != 'skipped' && steps.bbs-fixed-case-qa.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-bbs-fixed-case-qa-${{ github.sha }}
          path: |
            build/reports/attachment-bbs-fixed-case-qa/TAEBAEK-184816-fixed-case.json
            build/test-results/attachmentBbsFixedCaseQa/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 양평 실제 worker·임시 DB·API 검증 — 운영 쓰기 없음
        id: official-worker-qa
        # CI에서 반복된 공식 사이트 시간 초과는 자동 재실행하지 않는다. 접근 상태 변화 후 수동으로만 실행한다.
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.verify-official-worker == true }}
        run: bash ./gradlew attachmentOfficialWorkerIntegrationTest --no-daemon --console=plain --max-workers=1

      - name: 공식 worker DB·API metadata 보관 — 원문 없음
        if: ${{ always() && steps.official-worker-qa.outcome != 'skipped' && steps.official-worker-qa.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-official-worker-${{ github.sha }}
          path: |
            build/reports/attachment-official-worker/YANGPYEONG-312241.json
            build/reports/attachment-official-worker/YANGPYEONG-311846.json
            build/reports/attachment-official-worker/YANGPYEONG-311507.json
            build/test-results/attachmentOfficialWorkerIntegrationTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 태백 HWP 실제 worker·임시 DB·API 검증 — 배포 없음
        id: taebaek-hwp-worker-qa
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.verify-taebaek-hwp-worker == true }}
        run: |
          set -euo pipefail
          export TAEBAEK_HWP_QA_STARTED_AT="$(date +%s)000"
          bash ./gradlew attachmentTaebaekHwpWorkerIntegrationTest --no-daemon --console=plain --max-workers=1
          node scripts/qa/attachment-taebaek-hwp-report.mjs

      - name: 태백 HWP worker metadata 보관 — 원문 없음
        if: ${{ always() && steps.taebaek-hwp-worker-qa.outcome != 'skipped' && steps.taebaek-hwp-worker-qa.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-taebaek-hwp-worker-${{ github.sha }}
          path: |
            build/reports/attachment-taebaek-hwp-worker/TAEBAEK-176153.json
            build/test-results/attachmentTaebaekHwpWorkerIntegrationTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 제천 실제 worker·임시 DB·API 검증 — 배포 없음
        id: jecheon-worker-qa
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.verify-jecheon-worker == true }}
        run: |
          set -euo pipefail
          export JECHEON_WORKER_QA_STARTED_AT="$(date +%s)000"
          bash ./gradlew attachmentJecheonWorkerIntegrationTest --no-daemon --console=plain --max-workers=1
          node scripts/qa/attachment-jecheon-worker-report.mjs

      - name: 제천 worker metadata 보관 — 원문 없음
        if: ${{ always() && steps.jecheon-worker-qa.outcome != 'skipped' && steps.jecheon-worker-qa.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-jecheon-worker-${{ github.sha }}
          path: |
            build/reports/attachment-jecheon-worker/JECHEON-403587.json
            build/reports/attachment-jecheon-worker/JECHEON-403530.json
            build/reports/attachment-jecheon-worker/JECHEON-403490.json
            build/test-results/attachmentJecheonWorkerIntegrationTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 보은 실제 worker·임시 DB·API 검증 — 배포 없음
        id: boeun-worker-qa
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.verify-boeun-worker == true }}
        run: |
          set -euo pipefail
          export BOEUN_WORKER_QA_STARTED_AT="$(date +%s)000"
          bash ./gradlew attachmentBoeunWorkerIntegrationTest --no-daemon --console=plain --max-workers=1
          node scripts/qa/attachment-boeun-worker-report.mjs

      - name: 보은 worker metadata 보관 — 원문 없음
        if: ${{ always() && steps.boeun-worker-qa.outcome != 'skipped' && steps.boeun-worker-qa.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-boeun-worker-${{ github.sha }}
          path: |
            build/reports/attachment-boeun-worker/BOEUN-221499.json
            build/reports/attachment-boeun-worker/BOEUN-221497.json
            build/reports/attachment-boeun-worker/BOEUN-218812.json
            build/test-results/attachmentBoeunWorkerIntegrationTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 양평 고정 공고 제목·본문·전체 첨부 관측 — 운영 쓰기 없음
        id: yangpyeong-official-observation
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.observe-yangpyeong-official-files == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[yangpyeong-observation]'))) }}
        run: bash ./gradlew attachmentBbsOfficialFileObservation -PsanebBbsObservationGroup=YANGPYEONG --no-daemon --console=plain --max-workers=1

      - name: 양평 세 단계 관측 metadata 보관 — 원문 없음
        if: ${{ always() && steps.yangpyeong-official-observation.outcome != 'skipped' && steps.yangpyeong-official-observation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-yangpyeong-official-observation-${{ github.sha }}
          path: |
            build/reports/attachment-bbs-official-observation/YANGPYEONG-312241.json
            build/reports/attachment-bbs-official-observation/YANGPYEONG-311846.json
            build/reports/attachment-bbs-official-observation/YANGPYEONG-311507.json
            build/test-results/attachmentBbsOfficialFileObservation/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 제천 고정 공고 제목·본문·전체 첨부 관측 — 운영 쓰기 없음
        id: jecheon-official-observation
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.observe-jecheon-official-files == true }}
        run: |
          set -euo pipefail
          export JECHEON_OBSERVATION_STARTED_AT="$(date +%s)000"
          bash ./gradlew attachmentBbsOfficialFileObservation -PsanebBbsObservationGroup=JECHEON --no-daemon --console=plain --max-workers=1
          node scripts/qa/attachment-jecheon-observation-report.mjs

      - name: 제천 세 단계 관측 metadata 보관 — 원문 없음
        if: ${{ always() && steps.jecheon-official-observation.outcome != 'skipped' && steps.jecheon-official-observation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-jecheon-official-observation-${{ github.sha }}
          path: |
            build/reports/attachment-bbs-official-observation/JECHEON-403587.json
            build/reports/attachment-bbs-official-observation/JECHEON-403530.json
            build/reports/attachment-bbs-official-observation/JECHEON-403490.json
            build/test-results/attachmentBbsOfficialFileObservation/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 충주 고정 공고 제목·본문·전체 첨부 관측 — 운영 쓰기 없음
        id: chungju-official-observation
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.observe-chungju-official-files == true }}
        run: |
          set -euo pipefail
          export CHUNGJU_OBSERVATION_STARTED_AT="$(date +%s)000"
          bash ./gradlew attachmentBbsOfficialFileObservation -PsanebBbsObservationGroup=CHUNGJU --no-daemon --console=plain --max-workers=1
          node scripts/qa/attachment-chungju-observation-report.mjs

      - name: 충주 세 단계 관측 metadata 보관 — 원문 없음
        if: ${{ always() && steps.chungju-official-observation.outcome != 'skipped' && steps.chungju-official-observation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-chungju-official-observation-${{ github.sha }}
          path: |
            build/reports/attachment-bbs-official-observation/CHUNGJU-72625.json
            build/reports/attachment-bbs-official-observation/CHUNGJU-72039.json
            build/reports/attachment-bbs-official-observation/CHUNGJU-70852.json
            build/test-results/attachmentBbsOfficialFileObservation/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 옥천 고정 공고 제목·본문·전체 첨부 관측 — 운영 쓰기 없음
        id: okcheon-official-observation
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[okcheon-observation]') }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export OKCHEON_OBSERVATION_STARTED_AT="$(date +%s)000"
          bash ./gradlew attachmentBbsOfficialFileObservation -PsanebBbsObservationGroup=OKCHEON --no-daemon --console=plain --max-workers=1
          node scripts/qa/attachment-okcheon-observation-report.mjs

      - name: 옥천 세 단계 관측 metadata 보관 — 원문 없음
        if: ${{ always() && steps.okcheon-official-observation.outcome != 'skipped' && steps.okcheon-official-observation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attachment-okcheon-official-observation-${{ github.sha }}
          path: |
            build/reports/attachment-bbs-official-observation/OKCHEON-193369.json
            build/reports/attachment-bbs-official-observation/OKCHEON-193297.json
            build/reports/attachment-bbs-official-observation/OKCHEON-193187.json
            build/test-results/attachmentBbsOfficialFileObservation/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: 검증 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-contract-qa-${{ github.sha }}
          path: |
            build/test-results/test/TEST-*.xml
            build/test-results/attachmentJobIntegrationTest/TEST-*.xml
            build/test-results/attachmentMigrationTest/TEST-*.xml
            build/test-results/flywayIntegrationTest/TEST-*.xml
            build/test-results/attachmentRuntimeIntegrationTest/TEST-*.xml
            build/test-results/attachmentWorkerIntegrationTest/TEST-*.xml
            build/test-results/attachmentContractQaTest/TEST-*.xml
            build/test-results/attachmentPolicyDbQaIntegrationTest/TEST-*.xml
            attachment-extractor/build/test-results/test/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
