<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${page.pageTitle}, ~{::main})}">
<main class="consultation-page"
      data-consultation-app
      th:data-operating="${page.operating}">
    <section class="summary-panel">
        <div class="summary-header">
            <div>
                <div class="section-label" th:text="${page.pageTitle}">상담 요청</div>
                <p th:text="${page.summaryText}">상담이 필요한 내용을 남기면 운영자가 확인한 뒤 담당자를 배정합니다.</p>
            </div>
            <span class="soft-status">수기 배정</span>
        </div>
    </section>

    <section class="consultation-grid">
        <section class="plain-panel consultation-request-panel">
            <div class="panel-heading compact-heading">
                <div>
                    <span class="eyebrow">상담 요청</span>
                    <h2>상담 요청 접수</h2>
                </div>
            </div>
            <form data-consultation-request-form novalidate>
                <div class="field-block" th:if="${page.operating}" data-person-picker="member" data-lookup-url="/api/v1/matching/cases/member-lookups">
                    <label for="consultationMemberSearch">회원 검색</label>
                    <input id="consultationMemberSearch" data-person-query type="search" maxlength="100" placeholder="성함 또는 로그인 아이디" aria-describedby="consultationMemberHelp">
                    <button type="button" class="secondary-action" data-person-search>회원 검색</button>
                    <label for="consultationMemberResult">회원 선택</label>
                    <select id="consultationMemberResult" data-person-results aria-describedby="consultationMemberHelp"><option value="">검색 후 회원을 선택하세요</option></select>
                    <div class="form-actions"><button type="button" class="secondary-action" data-person-prev disabled>이전 결과</button><button type="button" class="secondary-action" data-person-next disabled>다음 결과</button></div>
                    <input name="memberUserId" type="hidden">
                    <p data-person-selected class="field-help">선택된 회원이 없습니다.</p>
                    <p id="consultationMemberHelp" data-person-message class="field-help" role="status">동명이인은 아이디로 구분하세요. 검색 결과에서 회원을 선택해야 접수할 수 있습니다.</p>
                </div>
                <div class="field-block">
                    <label for="consultationRequestNote">상담 요청 내용</label>
                    <textarea id="consultationRequestNote" name="requestNote" rows="5" maxlength="1000"
                              placeholder="상담이 필요한 내용을 입력하세요."></textarea>
                </div>
                <p class="basic-info-message" data-consultation-message role="status"></p>
                <div class="form-actions">
                    <button class="primary-action button-action" type="submit" data-consultation-request-submit>
                        상담 요청 접수
                    </button>
                </div>
            </form>
        </section>

        <section class="plain-panel consultation-list-panel">
            <div class="panel-heading compact-heading">
                <div>
                    <span class="eyebrow">요청 목록</span>
                    <h2>상담 요청 현황</h2>
                </div>
                <button class="secondary-action" type="button" data-consultation-refresh>새로고침</button>
            </div>
            <div class="consultation-list" data-consultation-list></div>
        </section>
    </section>

    <section class="plain-panel consultation-operating-panel" th:if="${page.operating}">
        <div class="panel-heading compact-heading">
            <div>
                <span class="eyebrow">운영자 처리</span>
                <h2>담당자 배정 및 상태 변경</h2>
            </div>
        </div>
        <form data-consultation-status-form novalidate>
            <div class="form-grid">
                <div class="field-block">
                    <label for="consultationReservationId">상담 요청 코드</label>
                    <input id="consultationReservationId" name="reservationId" type="hidden">
                    <input type="text" placeholder="목록에서 선택" data-consultation-reservation-code readonly>
                </div>
                <div class="field-block">
                    <label for="consultationStatusCode">상태</label>
                    <select id="consultationStatusCode" name="statusCode">
                        <option value="" disabled selected>상담 요청을 먼저 선택하세요</option>
                        <option value="REQUESTED" disabled>요청 접수</option>
                        <option value="ASSIGNED">담당자 배정</option>
                        <option value="CONFIRMED">상담 확정</option>
                        <option value="COMPLETED">상담 완료</option>
                        <option value="NO_SHOW">미참석</option>
                        <option value="CANCELED">취소</option>
                    </select>
                </div>
                <div class="field-block" data-person-picker="partner" data-lookup-url="/api/v1/consultation-reservations/partner-lookups">
                    <label for="consultationPartnerSearch">담당자 검색</label>
                    <input id="consultationPartnerSearch" data-person-query type="search" maxlength="100" placeholder="성함 또는 로그인 아이디" aria-describedby="consultationPartnerHelp">
                    <button type="button" class="secondary-action" data-person-search>담당자 검색</button>
                    <label for="consultationPartnerResult">담당자 선택</label>
                    <select id="consultationPartnerResult" data-person-results aria-describedby="consultationPartnerHelp"><option value="">검색 후 담당자를 선택하세요</option></select>
                    <div class="form-actions"><button type="button" class="secondary-action" data-person-prev disabled>이전 결과</button><button type="button" class="secondary-action" data-person-next disabled>다음 결과</button></div>
                    <input name="partnerUserId" type="hidden">
                    <p data-consultation-current-partner class="field-help">먼저 처리할 상담 요청을 선택하세요.</p>
                    <p data-person-selected class="field-help">담당자 미배정</p>
                    <p id="consultationPartnerHelp" data-person-message class="field-help" role="status">현재 담당자는 유지됩니다. 변경하려면 성함·아이디로 검색한 뒤 선택하세요.</p>
                </div>
                <div class="field-block span-2">
                    <label for="consultationStatusNote">상담 메모</label>
                    <textarea id="consultationStatusNote" name="note" rows="3" maxlength="1000"
                              placeholder="배정 사유, 상담 결과, 취소 사유 등을 입력하세요."></textarea>
                </div>
            </div>
            <p class="basic-info-message" data-consultation-status-message role="status"></p>
            <div class="form-actions">
                <button class="primary-action button-action" type="submit" data-consultation-status-submit>
                    상태 저장
                </button>
            </div>
        </form>
    </section>
    <script th:src="@{/js/saneb-person-identity.js}"></script>
    <script th:src="@{/js/saneb-person-picker.js}"></script>
    <script th:src="@{/js/saneb-consultations.js}"></script>
</main>
</html>
