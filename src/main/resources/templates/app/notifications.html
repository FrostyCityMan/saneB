<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${page.pageTitle}, ~{::main})}">
<main class="notification-page"
      data-notification-page
      data-notification-list-url="/api/v1/notifications/me">
    <section class="summary-panel">
        <div class="summary-header">
            <div>
                <div class="section-label">알림</div>
                <p>사내비 진행 과정에서 확인해야 할 안내와 리마인드를 모아 보여줍니다.</p>
            </div>
            <span class="soft-status">인앱 알림</span>
        </div>
    </section>

    <section class="plain-panel notification-list-panel">
        <div class="panel-heading compact-heading">
            <div>
                <span class="eyebrow">내 알림</span>
                <h2>확인할 알림</h2>
            </div>
            <div class="notification-toolbar">
                <label class="notification-filter">
                    <input type="checkbox" data-notification-unread-filter>
                    <span>읽지 않은 알림만</span>
                </label>
                <button class="secondary-action" type="button" data-notification-refresh>새로고침</button>
            </div>
        </div>
        <p class="field-help">알림을 확인하면 읽음 처리할 수 있습니다. 외부 문자, 카카오, 이메일 발송은 아직 연결하지 않습니다.</p>
        <div class="notification-list" data-notification-list></div>
    </section>
    <script th:src="@{/js/saneb-notifications.js}"></script>
</main>
</html>
