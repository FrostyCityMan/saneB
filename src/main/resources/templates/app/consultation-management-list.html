<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('상담 관리', ~{::main})}">
<main class="consultation-workspace" data-consultation-management="list" >
<link rel="stylesheet" th:href="@{/css/saneb-consultation-management.css}">
<header class="summary-panel summary-header cm-heading"><div><h2 class="section-label">상담 관리</h2><p>목록에서 상담을 찾고 상세에서 한 건씩 처리합니다.</p></div>
<a class="secondary-action" href="/app/admin/consultations/new" data-new-link>상담 접수</a></header>
<p data-feedback role="status" class="cm-notice" hidden></p>
<p data-error role="alert" tabindex="-1" class="cm-notice cm-error" hidden></p>
<section class="plain-panel">
<form data-filter class="cm-filters">
<div class="field-block"><label for="status-filter">상담 상태</label><select id="status-filter" name="statusCode">
<option value="">전체 상태</option><option value="REQUESTED">요청 접수</option><option value="ASSIGNED">담당자 배정</option><option value="CONFIRMED">상담 확정</option><option value="COMPLETED">상담 완료</option><option value="NO_SHOW">미참석</option><option value="CANCELED">취소</option></select></div>
<div class="field-block"><label for="page-size">표시 개수</label><select id="page-size" name="size"><option value="20">20건</option><option value="50">50건</option></select></div>
<button type="submit" class="primary-action">조회</button><a href="/app/admin/consultations" class="secondary-action">초기화</a><button type="button" class="secondary-action" data-reload>새로고침</button></form>
<p data-count role="status">상담을 불러오는 중입니다.</p>
<table class="cm-table" data-table hidden><caption class="cm-sr-only">상담 요청 목록 · 상담 시간 또는 접수일 기준 내림차순</caption>
<thead><tr><th scope="col">요청 코드 / 회원</th><th scope="col">상담 요청</th><th scope="col">담당자</th><th scope="col">상태</th><th scope="col">접수일</th><th scope="col">상세</th></tr></thead><tbody data-rows></tbody></table>
<p data-empty hidden></p><nav data-pagination class="cm-pagination" aria-label="상담 목록 페이지"></nav></section>
<script th:src="@{/js/saneb-person-identity.js}"></script>
<script th:src="@{/js/saneb-person-picker.js}"></script>
<script th:src="@{/js/saneb-consultation-management-model.js}"></script>
<script th:src="@{/js/saneb-consultation-management.js}"></script>
</main></html>
