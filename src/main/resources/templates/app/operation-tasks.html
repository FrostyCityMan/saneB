<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${page.pageTitle}, ~{::main})}">
<main class="operation-task-page"
      data-operation-task-page
      data-operation-task-url="/api/v1/operation-tasks">
    <section class="summary-panel">
        <div class="summary-header">
            <div>
                <div class="section-label">운영 업무 큐</div>
                <p>장기 미진행, TM 재접촉, 상담 대기 등 사람이 확인해야 할 업무를 처리합니다.</p>
            </div>
            <span class="soft-status">운영자 전용</span>
        </div>
    </section>

    <section class="plain-panel operation-task-panel">
        <div class="panel-heading compact-heading">
            <div>
                <span class="eyebrow">처리 목록</span>
                <h2>운영 업무</h2>
            </div>
            <button class="secondary-action" type="button" data-operation-task-refresh>새로고침</button>
        </div>
        <form class="operation-task-filters" data-operation-task-filter-form>
            <div class="field-block">
                <label for="operationTaskType">업무 유형</label>
                <select id="operationTaskType" name="taskTypeCode">
                    <option value="">전체</option>
                    <option value="DELAYED_PROGRESS">장기 미진행</option>
                    <option value="RECONTACT">TM 재접촉</option>
                    <option value="SUPPLEMENT_REQUEST">보완 요청</option>
                    <option value="CONSULTATION_PENDING">상담 대기</option>
                    <option value="PAYMENT_FAILED">결제 확인</option>
                    <option value="GENERAL">일반 업무</option>
                </select>
            </div>
            <div class="field-block">
                <label for="operationTaskStatus">상태</label>
                <select id="operationTaskStatus" name="statusCode">
                    <option value="">전체</option>
                    <option value="OPEN">대기</option>
                    <option value="IN_PROGRESS">처리중</option>
                    <option value="WAITING">보류</option>
                    <option value="DONE">완료</option>
                    <option value="CANCELED">취소</option>
                </select>
            </div>
            <div class="field-block">
                <label for="operationTaskPriority">중요도</label>
                <select id="operationTaskPriority" name="priorityCode">
                    <option value="">전체</option>
                    <option value="URGENT">긴급</option>
                    <option value="HIGH">높음</option>
                    <option value="NORMAL">보통</option>
                    <option value="LOW">낮음</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="primary-action button-action" type="submit">조회</button>
            </div>
        </form>
        <div class="operation-task-list" data-operation-task-list></div>
    </section>
    <script th:src="@{/js/saneb-operation-tasks.js}"></script>
</main>
</html>
