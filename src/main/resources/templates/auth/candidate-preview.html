<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>가입 전 후보 확인 | 사내비</title>
    <link rel="icon" href="data:,">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/saneb-dashboard.css}">
    <script th:src="@{/js/saneb-csrf.js}"></script>
    <script th:src="@{/js/saneb-loading.js}"></script>
    <script th:src="@{/js/saneb-candidate-preview.js}" defer></script>
</head>
<body class="saneb-body public-preview-body">
<main class="public-preview-shell" data-candidate-preview-app>
    <section class="public-preview-hero" aria-labelledby="candidatePreviewTitle">
        <a class="login-brand" th:href="@{/login}" aria-label="사내비 로그인">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M12 2.4 20 5.7v5.8c0 5.1-3.3 8.4-8 10.1-4.7-1.7-8-5-8-10.1V5.7l8-3.3Z"/>
                    <path d="m8.3 12.1 2.3 2.2 5.1-5.4"/>
                </svg>
            </span>
            <span>사내비</span>
        </a>
        <div>
            <span class="eyebrow">가입 전 임시 확인</span>
            <h1 id="candidatePreviewTitle">기본 정보만으로 현재 가능한 공고를 먼저 확인하세요.</h1>
            <p>입력값은 저장하지 않습니다. 가족 간단 정보까지 포함해 넓은 범위의 후보를 먼저 확인합니다.</p>
        </div>
        <div class="public-preview-actions">
            <a class="primary-action button-action" th:href="@{/signup}">회원가입</a>
            <a class="secondary-action" th:href="@{/login}">로그인</a>
        </div>
    </section>

    <section class="public-preview-panel" aria-label="가입 전 후보 확인 입력">
        <form class="public-preview-form" data-candidate-preview-form novalidate>
            <div class="form-grid">
                <div class="field-block">
                    <label for="previewRepresentativeName">대표자명</label>
                    <input id="previewRepresentativeName" name="representativeName" type="text" maxlength="100"
                           placeholder="예: 홍길동">
                </div>
                <div class="field-block">
                    <label for="previewBirthYear">출생연도</label>
                    <input id="previewBirthYear" name="birthYear" type="number" min="1900" max="2200"
                           placeholder="예: 1988">
                    <small data-preview-age-output>나이는 자동으로 계산됩니다.</small>
                </div>
                <div class="field-block">
                    <label for="previewRegionCode">사업장 지역</label>
                    <select id="previewRegionCode" name="regionCode">
                        <option value="">선택 안 함</option>
                        <option value="SEOUL">서울</option>
                        <option value="BUSAN">부산</option>
                        <option value="DAEGU">대구</option>
                        <option value="INCHEON">인천</option>
                        <option value="GWANGJU">광주</option>
                        <option value="DAEJEON">대전</option>
                        <option value="ULSAN">울산</option>
                        <option value="SEJONG">세종</option>
                        <option value="GYEONGGI">경기</option>
                        <option value="GANGWON">강원</option>
                        <option value="CHUNGBUK">충북</option>
                        <option value="CHUNGNAM">충남</option>
                        <option value="JEONBUK">전북</option>
                        <option value="JEONNAM">전남</option>
                        <option value="GYEONGBUK">경북</option>
                        <option value="GYEONGNAM">경남</option>
                        <option value="JEJU">제주</option>
                    </select>
                </div>
                <div class="field-block">
                    <label for="previewKsicCode">업종</label>
                    <input id="previewKsicCode" name="ksicCode" type="text" maxlength="30"
                           placeholder="KSIC 코드를 알고 있는 경우만 입력">
                </div>
                <div class="field-block">
                    <label for="previewOpeningDate">사업 시작일</label>
                    <input id="previewOpeningDate" name="openingDate" type="date">
                    <small data-preview-business-years-output>업력은 자동으로 계산됩니다.</small>
                </div>
                <div class="field-block">
                    <label for="previewAnnualRevenue">연매출</label>
                    <input id="previewAnnualRevenue" name="annualRevenue" type="number" min="0" step="10000"
                           placeholder="선택 입력">
                </div>
            </div>
            <div class="option-section">
                <div class="panel-heading compact-heading">
                    <div>
                        <span class="eyebrow">가족 간단 정보</span>
                        <h2>배우자, 자녀, 부모</h2>
                    </div>
                    <button class="secondary-action" type="button" data-preview-family-add>가족 추가</button>
                </div>
                <p class="field-help">배우자·자녀·부모를 여러 명 입력할 수 있습니다. 모르는 항목은 비워 두세요.</p>
                <div class="family-list" data-preview-family-list></div>
            </div>
            <p class="basic-info-message" data-candidate-preview-message role="status"></p>
            <div class="form-actions">
                <button class="primary-action button-action" type="submit" data-candidate-preview-submit>
                    간단 결과 확인하기
                </button>
            </div>
        </form>

        <section class="public-preview-result" data-candidate-preview-result hidden aria-live="polite">
            <div>
                <span>가능 후보 수</span>
                <strong><span data-candidate-count>0</span>건</strong>
            </div>
            <div>
                <span>예상 지원금 범위</span>
                <strong data-candidate-amount>확인 필요</strong>
            </div>
            <p data-candidate-notice>회원가입 전 임시 확인 결과입니다.</p>
            <a class="primary-action button-action" th:href="@{/signup}">회원가입하고 기본 정보 입력하기</a>
        </section>
    </section>
</main>
</body>
</html>
