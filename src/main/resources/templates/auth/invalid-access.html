<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | 사내비'">잘못된 접근 | 사내비</title>
    <link rel="icon" th:href="@{/images/saneb-logo-mark.svg}" href="/images/saneb-logo-mark.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/saneb-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/saneb-login.css}">
</head>
<body class="saneb-body saneb-login-body">
<main class="invalid-access-shell" aria-labelledby="invalidAccessTitle">
    <section class="invalid-access-card">
        <a class="login-brand invalid-access-brand" th:href="@{/login}" aria-label="사내비 로그인">
            <span class="brand-mark" aria-hidden="true">
                <img th:src="@{/images/saneb-logo-mark.svg}" src="/images/saneb-logo-mark.svg" alt="">
            </span>
            <span>사내비</span>
        </a>
        <div class="login-lock invalid-access-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/>
                <path d="M12 7.2v5.4"/>
                <path d="M12 16.4h.1"/>
            </svg>
        </div>
        <span class="section-label">잘못된 접근</span>
        <h1 id="invalidAccessTitle" th:text="${title}">로그인이 필요합니다</h1>
        <p th:text="${message}">로그인 정보가 만료되었거나 인증이 필요한 화면입니다.</p>
        <small th:text="${detail}">다시 로그인한 뒤 필요한 업무를 이어서 진행해 주세요.</small>
        <a class="login-submit invalid-access-action" th:href="@{/login}">로그인 화면으로 돌아가기</a>
    </section>
</main>
</body>
</html>
