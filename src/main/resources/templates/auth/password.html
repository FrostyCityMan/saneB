<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경 | saneB</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/saneb-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/saneb-login.css}">
    <script th:src="@{/js/saneb-password.js}" defer></script>
</head>
<body class="saneb-body saneb-login-body">
<main class="login-shell auth-single-shell" aria-label="saneB 비밀번호 변경">
    <section class="login-workspace auth-center-workspace" aria-labelledby="password-title">
        <a class="login-brand auth-brand" th:href="@{/app/dashboard}" aria-label="saneB 대시보드">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M12 2.4 20 5.7v5.8c0 5.1-3.3 8.4-8 10.1-4.7-1.7-8-5-8-10.1V5.7l8-3.3Z"/>
                    <path d="m8.3 12.1 2.3 2.2 5.1-5.4"/>
                </svg>
            </span>
            <span>saneB</span>
        </a>

        <div class="login-card auth-form-card">
            <div class="login-lock" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M7.5 10V7.8a4.5 4.5 0 0 1 9 0V10"/>
                    <path d="M6.2 10h11.6v9.2H6.2z"/>
                    <path d="M12 14v2.2"/>
                </svg>
            </div>
            <h2 id="password-title">비밀번호 변경</h2>
            <p class="login-intro">현재 비밀번호를 확인한 뒤 새 비밀번호를 저장합니다.</p>

            <form class="login-form" data-password-form th:action="@{/api/v1/auth/password}" method="post" novalidate>
                <div class="login-field">
                    <label for="currentPassword">현재 비밀번호</label>
                    <div class="input-shell">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M7.5 10V7.8a4.5 4.5 0 0 1 9 0V10"/><path d="M6.2 10h11.6v9.2H6.2z"/></svg>
                        </span>
                        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
                    </div>
                </div>

                <div class="login-field">
                    <label for="newPassword">새 비밀번호</label>
                    <div class="input-shell">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M7.5 10V7.8a4.5 4.5 0 0 1 9 0V10"/><path d="M6.2 10h11.6v9.2H6.2z"/></svg>
                        </span>
                        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
                    </div>
                </div>

                <div class="login-field">
                    <label for="newPasswordConfirm">새 비밀번호 확인</label>
                    <div class="input-shell">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M7.5 10V7.8a4.5 4.5 0 0 1 9 0V10"/><path d="M6.2 10h11.6v9.2H6.2z"/></svg>
                        </span>
                        <input id="newPasswordConfirm" name="newPasswordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
                    </div>
                </div>

                <p class="login-message" data-password-message role="alert" hidden></p>

                <button class="login-submit" type="submit" data-password-submit>비밀번호 변경</button>
            </form>

            <div class="auth-link-row">
                <a th:href="@{/app/dashboard}">대시보드로 이동</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
