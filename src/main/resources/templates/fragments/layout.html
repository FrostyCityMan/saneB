<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | saneB'">saneB</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/saneb-dashboard.css}">
</head>
<body class="saneb-body">
<div class="saneb-shell">
    <aside class="saneb-sidebar" aria-label="사용자 메뉴">
        <a class="brand" th:href="${page.auth.defaultRoute}">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M12 2.4 20 5.7v5.8c0 5.1-3.3 8.4-8 10.1-4.7-1.7-8-5-8-10.1V5.7l8-3.3Z"/>
                    <path d="m8.3 12.1 2.3 2.2 5.1-5.4"/>
                </svg>
            </span>
            <span>saneB</span>
        </a>

        <div class="role-pill" th:text="${page.roleLabel}">일반 사용자</div>

        <nav class="side-nav">
            <a class="side-link"
               th:if="${page.auth.primaryRole == 'USER' or page.auth.primaryRole == 'OPERATOR' or page.auth.primaryRole == 'ADMIN'}"
               th:href="${page.auth.defaultRoute}"
               th:classappend="${page.activeNav == 'DASHBOARD'} ? ' active' : ''">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 10.8 12 4l8 6.8v8.7a.8.8 0 0 1-.8.8h-5v-5.7H9.8v5.7h-5a.8.8 0 0 1-.8-.8v-8.7Z"/></svg>
                </span>
                <span>대시보드</span>
            </a>
            <a class="side-link"
               th:if="${#lists.contains(page.auth.roles, 'ADMIN')}"
               th:href="@{/app/admin/users}"
               th:classappend="${page.activeNav == 'ADMIN_USERS'} ? ' active' : ''">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M8.8 11.6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M3.8 20a5 5 0 0 1 10 0"/><path d="M16.2 8.2h4M18.2 6.2v4M16.2 14.8h4M16.2 18.2h4"/></svg>
                </span>
                <span>회원관리</span>
            </a>
            <a class="side-link"
               th:if="${#lists.contains(page.auth.roles, 'OPERATOR') or #lists.contains(page.auth.roles, 'ADMIN')}"
               th:href="@{/app/announcements/input}"
               th:classappend="${page.activeNav == 'ANNOUNCEMENT_INPUT'} ? ' active' : ''">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M6 4.2h12v15.6H6z"/><path d="M8.8 7.8h6.4M8.8 11.2h6.4M8.8 14.6h3.8"/><path d="M16.5 16.7 18.7 19"/></svg>
                </span>
                <span>공고 입력</span>
            </a>
            <a class="side-link"
               th:if="${#lists.contains(page.auth.roles, 'OPERATOR') or #lists.contains(page.auth.roles, 'APPROVER') or #lists.contains(page.auth.roles, 'ADMIN')}"
               th:href="@{/app/matching/cases}"
               th:classappend="${page.activeNav == 'MATCHING_CASES'} ? ' active' : ''">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M7 7.2h4.6l2.2 2.2H17"/><path d="M7 16.8h4.6l2.2-2.2H17"/><path d="M4 7.2h3M17 9.4l2-2-2-2M4 16.8h3M17 14.6l2 2-2 2"/></svg>
                </span>
                <span>매칭 관리</span>
            </a>
            <a class="side-link"
               th:if="${page.auth.primaryRole == 'USER'}"
               th:href="@{/app/member/verifications/current}"
               th:classappend="${page.activeNav == 'VERIFICATION_PROGRESS' or page.activeNav == 'PARTNER_VERIFICATION_INPUT'} ? ' active' : ''">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 3.6 19 6.4v5.2c0 4.6-2.9 7.4-7 8.8-4.1-1.4-7-4.2-7-8.8V6.4l7-2.8Z"/><path d="m8.6 12 2.2 2.1 4.5-4.7"/></svg>
                </span>
                <span>파트너 검증</span>
            </a>
            <a class="side-link"
               th:if="${page.auth.primaryRole != 'ADMIN'}"
               th:href="@{/app/application-progresses}"
               th:classappend="${page.activeNav == 'APPLICATION_PROGRESS'} ? ' active' : ''">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 6.8h14v13H5z"/><path d="M8 6.6V4.4h8v2.2M8.2 12h7.6M8.2 16h5"/></svg>
                </span>
                <span>진행 현황</span>
            </a>
        </nav>
    </aside>

    <div class="saneb-main">
        <header class="topbar">
            <div class="topbar-title">
                <span aria-hidden="true"></span>
                <h1 th:text="${title}">사용자 대시보드</h1>
            </div>
            <div class="account-area">
                <button class="icon-button" type="button" aria-label="알림">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 15.4V11a6 6 0 1 0-12 0v4.4L4.8 17h14.4L18 15.4Z"/><path d="M9.8 19a2.3 2.3 0 0 0 4.4 0"/></svg>
                    <span class="alert-dot">3</span>
                </button>
                <button class="icon-button help-button" type="button" aria-label="도움말">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M9.7 9.2a2.5 2.5 0 0 1 4.7 1.2c0 1.8-2 2-2 3.7M12 17.4h.1"/></svg>
                </button>
                <div class="account-copy">
                    <strong th:text="${page.auth.name}">사용자</strong>
                    <span th:text="${page.auth.loginId}">user01</span>
                </div>
                <a class="logout-button account-button" th:href="@{/password}" aria-label="비밀번호 변경">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7.5 10V7.8a4.5 4.5 0 0 1 9 0V10"/>
                        <path d="M6.2 10h11.6v9.2H6.2z"/>
                    </svg>
                    <span>비밀번호 변경</span>
                </a>
                <form class="logout-form" th:action="@{/logout}" method="post">
                    <button class="logout-button" type="submit" aria-label="로그아웃">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10 5H6.8A1.8 1.8 0 0 0 5 6.8v10.4A1.8 1.8 0 0 0 6.8 19H10"/>
                            <path d="M14 16.5 18.5 12 14 7.5"/>
                            <path d="M18 12H9"/>
                        </svg>
                        <span>로그아웃</span>
                    </button>
                </form>
                <div class="avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 12.2a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4.8 20.4a7.2 7.2 0 0 1 14.4 0"/></svg>
                </div>
            </div>
        </header>

        <main th:replace="${content}"></main>

        <footer class="saneb-footer">
            <a href="#">이용약관</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">고객센터</a>
            <span>© 2026 saneB. All rights reserved.</span>
        </footer>
    </div>
</div>
</body>
</html>
