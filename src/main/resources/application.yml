spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: saneB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saneb}
    username: ${DB_USERNAME:saneb}
    password: ${DB_PASSWORD:saneb}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      max-file-size: ${SANEB_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${SANEB_MAX_REQUEST_SIZE:12MB}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.saneb.config.typehandler
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.saneb: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

saneb:
  logging:
    app-log-path: ${SANEB_APP_LOG_PATH:/home/ubuntu/app/app.log}
    app-log-scan-lines: ${SANEB_APP_LOG_SCAN_LINES:3000}
  security:
    rate-limit:
      enabled: ${SANEB_RATE_LIMIT_ENABLED:true}
      max-requests: ${SANEB_RATE_LIMIT_MAX_REQUESTS:600}
      window-seconds: ${SANEB_RATE_LIMIT_WINDOW_SECONDS:60}
  storage:
    root: ${STORAGE_ROOT:build/saneb-storage}
    max-upload-bytes: ${SANEB_MAX_UPLOAD_BYTES:10485760}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  operation:
    inactivity:
      enabled: ${SANEB_INACTIVITY_REMINDER_ENABLED:true}
      fixed-delay-ms: ${SANEB_INACTIVITY_REMINDER_FIXED_DELAY_MS:3600000}
      initial-delay-ms: ${SANEB_INACTIVITY_REMINDER_INITIAL_DELAY_MS:60000}
      batch-size: ${SANEB_INACTIVITY_REMINDER_BATCH_SIZE:50}
  ai:
    provider-code: ${SANEB_AI_PROVIDER_CODE:LOCAL_SAFE}
    model-code: ${SANEB_AI_MODEL_CODE:RULE_TEMPLATE_V1}
  bootstrap:
    admin:
      enabled: ${SANEB_BOOTSTRAP_ADMIN_ENABLED:false}
      login-id: ${SANEB_BOOTSTRAP_ADMIN_LOGIN_ID:}
      password: ${SANEB_BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${SANEB_BOOTSTRAP_ADMIN_NAME:기초 관리자}
