spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: saneB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saneb}
    username: ${DB_USERNAME:saneb}
    password: ${DB_PASSWORD:saneb}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    check-template-location: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.saneb.config.typehandler
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.saneb: INFO

saneb:
  bootstrap:
    admin:
      enabled: ${SANEB_BOOTSTRAP_ADMIN_ENABLED:false}
      login-id: ${SANEB_BOOTSTRAP_ADMIN_LOGIN_ID:}
      password: ${SANEB_BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${SANEB_BOOTSTRAP_ADMIN_NAME:기초 관리자}
