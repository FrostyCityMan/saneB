spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: saneB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saneb}
    username: ${DB_USERNAME:saneb}
    password: ${DB_PASSWORD:saneb}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      max-file-size: ${SANEB_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${SANEB_MAX_REQUEST_SIZE:12MB}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.saneb.config.typehandler
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.saneb: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

saneb:
  logging:
    app-log-path: ${SANEB_APP_LOG_PATH:/home/ubuntu/app/app.log}
    app-log-scan-lines: ${SANEB_APP_LOG_SCAN_LINES:3000}
  security:
    rate-limit:
      enabled: ${SANEB_RATE_LIMIT_ENABLED:true}
      max-requests: ${SANEB_RATE_LIMIT_MAX_REQUESTS:600}
      window-seconds: ${SANEB_RATE_LIMIT_WINDOW_SECONDS:60}
  storage:
    root: ${STORAGE_ROOT:build/saneb-storage}
    max-upload-bytes: ${SANEB_MAX_UPLOAD_BYTES:10485760}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  operation:
    inactivity:
      enabled: ${SANEB_INACTIVITY_REMINDER_ENABLED:true}
      fixed-delay-ms: ${SANEB_INACTIVITY_REMINDER_FIXED_DELAY_MS:3600000}
      initial-delay-ms: ${SANEB_INACTIVITY_REMINDER_INITIAL_DELAY_MS:60000}
      batch-size: ${SANEB_INACTIVITY_REMINDER_BATCH_SIZE:50}
  address:
    road:
      enabled: ${JUSO_API_ENABLED:false}
      base-url: ${JUSO_API_BASE_URL:https://business.juso.go.kr/addrlink/addrLinkApi.do}
      api-key: ${JUSO_API_KEY:}
      timeout-millis: ${JUSO_API_TIMEOUT_MILLIS:5000}
  announcement-source:
    classification-v2:
      enabled: ${SANEB_ANNOUNCEMENT_SOURCE_CLASSIFICATION_V2_ENABLED:false}
      maximum-search-combinations: ${SANEB_ANNOUNCEMENT_SOURCE_CLASSIFICATION_MAX_SEARCH_COMBINATIONS:50}
    collection:
      batch:
        enabled: ${SANEB_ANNOUNCEMENT_SOURCE_BATCH_ENABLED:false}
        cron: ${SANEB_ANNOUNCEMENT_SOURCE_BATCH_CRON:0 0 8 * * *}
        provider-codes: ${SANEB_ANNOUNCEMENT_SOURCE_BATCH_PROVIDER_CODES:BIZINFO}
        max-count: ${SANEB_ANNOUNCEMENT_SOURCE_BATCH_MAX_COUNT:100}
    providers:
      bizinfo:
        base-url: ${BIZINFO_API_BASE_URL:https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do}
        api-key: ${BIZINFO_API_KEY:}
        timeout-millis: ${BIZINFO_API_TIMEOUT_MILLIS:5000}
      gov24:
        base-url: ${GOV24_PUBLIC_SERVICE_API_BASE_URL:}
        api-key: ${GOV24_PUBLIC_SERVICE_API_KEY:}
        timeout-millis: ${GOV24_PUBLIC_SERVICE_API_TIMEOUT_MILLIS:5000}
    local-government:
      timeout-millis: ${SANEB_LOCAL_GOV_NOTICE_TIMEOUT_MILLIS:15000}
      max-response-bytes: ${SANEB_LOCAL_GOV_NOTICE_MAX_RESPONSE_BYTES:2097152}
      max-concurrency: ${SANEB_LOCAL_GOV_NOTICE_MAX_CONCURRENCY:4}
      user-agent: ${SANEB_LOCAL_GOV_NOTICE_USER_AGENT:saneB-notice-collector/1.0}
      detail-body:
        enabled: ${SANEB_LOCAL_GOV_NOTICE_DETAIL_BODY_ENABLED:false}
        connect-timeout-millis: ${SANEB_LOCAL_GOV_NOTICE_DETAIL_CONNECT_TIMEOUT_MILLIS:3000}
        read-timeout-millis: ${SANEB_LOCAL_GOV_NOTICE_DETAIL_READ_TIMEOUT_MILLIS:7000}
        max-response-bytes: ${SANEB_LOCAL_GOV_NOTICE_DETAIL_MAX_RESPONSE_BYTES:2097152}
        max-redirects: ${SANEB_LOCAL_GOV_NOTICE_DETAIL_MAX_REDIRECTS:3}
        max-host-concurrency: ${SANEB_LOCAL_GOV_NOTICE_DETAIL_MAX_HOST_CONCURRENCY:2}
      schedule:
        enabled: ${SANEB_LOCAL_GOV_NOTICE_SCHEDULE_ENABLED:false}
        poll-delay-millis: ${SANEB_LOCAL_GOV_NOTICE_SCHEDULE_POLL_DELAY_MILLIS:60000}
        initial-delay-millis: ${SANEB_LOCAL_GOV_NOTICE_SCHEDULE_INITIAL_DELAY_MILLIS:30000}
  ai:
    provider-code: ${SANEB_AI_PROVIDER_CODE:LOCAL_SAFE}
    model-code: ${SANEB_AI_MODEL_CODE:RULE_TEMPLATE_V1}
  bootstrap:
    admin:
      enabled: ${SANEB_BOOTSTRAP_ADMIN_ENABLED:false}
      login-id: ${SANEB_BOOTSTRAP_ADMIN_LOGIN_ID:}
      password: ${SANEB_BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${SANEB_BOOTSTRAP_ADMIN_NAME:기초 관리자}
