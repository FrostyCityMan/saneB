plugins {
    id 'application'
}

group = 'com.saneb'
version = '1.0.2'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
application { mainClass = 'com.saneb.extractor.AttachmentExtractorMain' }
dependencies {
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '256m'; maxParallelForks = 1 }
tasks.named('jar') { manifest { attributes 'Implementation-Version': project.version } }

// 신뢰한 합성 입력만 빌드 시 생성한다. 파서 의존성을 Spring 서버 classpath에 추가하지 않는다.
sourceSets {
    qaFixtures {
        compileClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('generateRuntimeQaFixtures', JavaExec) {
    dependsOn tasks.named('qaFixturesClasses')
    classpath = sourceSets.qaFixtures.runtimeClasspath
    mainClass = 'com.saneb.extractor.qa.AttachmentRuntimeFixtureGenerator'
    def destination = layout.buildDirectory.dir('generated/runtime-qa/attachment-runtime-qa')
    args destination.get().asFile.absolutePath
    inputs.files(sourceSets.qaFixtures.output, configurations.runtimeClasspath)
    outputs.dir(destination)
    maxHeapSize = '128m'
}
tasks.named('processTestResources') {
    dependsOn 'generateRuntimeQaFixtures'
    from(layout.buildDirectory.dir('generated/runtime-qa'))
}
