plugins {
    id 'application'
}

group = 'com.saneb'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
application { mainClass = 'com.saneb.extractor.AttachmentExtractorMain' }
dependencies {
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '256m'; maxParallelForks = 1 }
tasks.named('jar') { manifest { attributes 'Implementation-Version': project.version } }
