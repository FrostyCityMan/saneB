    description = '제천 고정3건의 제목·본문·전체 HWPX를 worker/임시 PostgreSQL/API로 검증합니다. 최대132요청/240MiB, 운영 쓰기 없음.'
    group = 'verification'
    dependsOn ':attachment-extractor:installDist'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/AnnouncementAttachmentOfficialWorkerIntegrationTest.class'
    environment 'SANEB_ATTACHMENT_OFFICIAL_WORKER_QA', 'true'
    systemProperty 'saneb.attachment-official-worker.group', 'JECHEON'
    systemProperty 'saneb.attachment-qa.extractor-root', project(':attachment-extractor').layout.buildDirectory.dir('install/attachment-extractor').get().asFile.absolutePath
    systemProperty 'saneb.attachment-official-worker.report', layout.buildDirectory.dir('reports/attachment-jecheon-worker').get().asFile.absolutePath
    systemProperty 'logback.configurationFile', layout.projectDirectory.file('src/attachmentContractQa/config/logback-qa.xml').asFile.absolutePath
    maxParallelForks = 1
    maxHeapSize = '384m'
    outputs.upToDateWhen { false }
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/attachmentJecheonWorkerIntegrationTest')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/attachmentJecheonWorkerIntegrationTest')
}

