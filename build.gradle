plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.saneb'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    mockitoAgent
}

// 수동 클래스 목록 대신 현재 애플리케이션 전체 클래스/리소스의 검증 목록을 생성한다.
// 설치 시 실제 classpath 바이트와 대조하며 정책 QA의 코드 변경 감지에 사용한다.
def attachmentQaCodeDirectory = layout.buildDirectory.dir('generated/attachment-qa-code')
tasks.register('generateAttachmentQaCodeCatalog') {
    dependsOn 'compileJava', 'processResources'
    def roots = files(tasks.named('compileJava').flatMap { it.destinationDirectory },
            tasks.named('processResources').map { it.destinationDir })
    inputs.files(roots).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(attachmentQaCodeDirectory.map { it.file('attachment-qa-code/catalog.json') })
    doLast {
        def entries = new TreeMap<String, Map>()
        roots.each { root ->
            fileTree(root).files.findAll { it.isFile() }.each { file ->
                String path = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                if (entries.containsKey(path)) throw new GradleException('애플리케이션 QA 목록의 classpath 경로가 중복되었습니다.')
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    for (int count; (count = stream.read(buffer)) != -1;) digest.update(buffer, 0, count)
                }
                entries.put(path, [path: path, size: file.length(), sha256: digest.digest().encodeHex().toString()])
            }
        }
        if (entries.isEmpty() || entries.size() > 10000) throw new GradleException('애플리케이션 QA 목록의 파일 수가 유효하지 않습니다.')
        def output = attachmentQaCodeDirectory.get().file('attachment-qa-code/catalog.json').asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.toJson([schemaVersion: 1, entries: entries.values().toList()]), 'UTF-8')
    }
}
sourceSets.main.output.dir([builtBy: 'generateAttachmentQaCodeCatalog'], attachmentQaCodeDirectory)

// 서버 JAR와 분리한 고정 DB QA 실행기. 운영 application classpath에는 JUnit/임시 DB를 넣지 않는다.
sourceSets {
    attachmentContractQa {
        compileClasspath += sourceSets.main.output + sourceSets.test.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.test.runtimeClasspath
    }
    attachmentContractQaTest {
        compileClasspath += sourceSets.attachmentContractQa.output + sourceSets.test.runtimeClasspath
        runtimeClasspath += sourceSets.attachmentContractQa.output + sourceSets.test.runtimeClasspath
    }
}

def attachmentContractClasses = [
        'AnnouncementAttachmentJobIntegrationTest',
        'AnnouncementAttachmentMigrationTest',
        'AnnouncementAttachmentBackfillIntegrationTest',
        'AnnouncementAttachmentWorkerIntegrationTest'
]
tasks.register('attachmentContractQaJar', Jar) {
    dependsOn 'attachmentContractQaClasses', 'testClasses'
    archiveBaseName = 'saneb-attachment-contract-qa'
    from(sourceSets.attachmentContractQa.output)
    from(sourceSets.main.output)
    from(sourceSets.test.output.classesDirs) { testFiles ->
        attachmentContractClasses.each { name -> testFiles.include "com/saneb/db/${name}*.class" }
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('installAttachmentContractQa', Sync) {
    group = 'distribution'
    description = '운영 DB 접속값 없이 고정 계약 suite를 실행하는 별도 Linux QA 산출물을 만듭니다. 실행·배포는 하지 않습니다.'
    dependsOn 'attachmentContractQaJar', ':attachment-extractor:installDist'
    into layout.buildDirectory.dir('install/attachment-contract-qa')
    from(tasks.named('attachmentContractQaJar')) { into 'lib' }
    from(configurations.testRuntimeClasspath) { into 'lib' }
    from('scripts/qa/run-attachment-contract-qa.sh') { into 'bin'; filePermissions { unix('rwxr-xr-x') } }
    from('src/attachmentContractQa/config') { into 'config' }
    from(project(':attachment-extractor').layout.buildDirectory.dir('install/attachment-extractor')) { into 'extractor' }
}
tasks.register('attachmentContractQaTest', Test) {
    group = 'verification'
    description = '고정 QA 실행기의 누락·실패·생략·중단·출력 보호 판정을 검증합니다. 실제 PostgreSQL 실행과 구분합니다.'
    dependsOn 'attachmentContractQaTestClasses', 'installAttachmentContractQa', 'bootJar'
    useJUnitPlatform()
    testClassesDirs = sourceSets.attachmentContractQaTest.output.classesDirs
    classpath = sourceSets.attachmentContractQaTest.runtimeClasspath
    // 내부의 의도적 실패/생략 fixture는 상위 테스트가 Launcher로 실행·판정한다.
    exclude '**/*$*'
    exclude '**/AttachmentWorkerDbQaLinuxIntegrationTest.class'
    maxParallelForks = 1
    maxHeapSize = '256m'
}
tasks.register('attachmentPolicyDbQaIntegrationTest', Test) {
    group = 'verification'
    description = 'Linux에서 실제 정책 부모의 namespace·PG 계약 전체 실행과 취소·정리를 검증합니다. 운영 DB는 사용하지 않습니다.'
    dependsOn 'attachmentContractQaTestClasses', 'installAttachmentContractQa'
    useJUnitPlatform()
    testClassesDirs = sourceSets.attachmentContractQaTest.output.classesDirs
    classpath = sourceSets.attachmentContractQaTest.runtimeClasspath
    include '**/AttachmentWorkerDbQaLinuxIntegrationTest.class'
    environment 'SANEB_ATTACHMENT_POLICY_DB_QA', 'true'
    maxParallelForks = 1
    maxHeapSize = '256m'
    // RLIMIT_NPROC는 자식만이 아니라 같은 UID의 thread에도 영향을 받는다. 격리 한도는 올리지 않는다.
    jvmArgs '-XX:ActiveProcessorCount=1', '-XX:+UseSerialGC'
}

// CI 부모 시험은 준비가 끝난 뒤 Gradle JVM 없이 실행한다. 운영/독립 QA JAR에 이 실행기를 넣지 않는다.
tasks.register('prepareAttachmentPolicyDbQaCi') {
    dependsOn 'attachmentContractQaTestClasses', 'installAttachmentContractQa'
    def output = layout.buildDirectory.file('policy-db-qa-ci/classpath.txt')
    outputs.file(output)
    outputs.upToDateWhen { false }
    doLast {
        String classpath = sourceSets.attachmentContractQaTest.runtimeClasspath.asPath
        if (classpath.contains('\n') || classpath.contains('\r')) throw new GradleException('QA classpath 형식이 올바르지 않습니다.')
        output.get().asFile.parentFile.mkdirs()
        output.get().asFile.setText(classpath, 'UTF-8')
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Docker 없이도 loopback 전용 임시 PostgreSQL에서 additive migration을 검증한다.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.15.0')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 역할별 HTTP 테스트의 독립 Spring 컨텍스트가 512 MiB 테스트 힙을 채우지 않도록 캐시만 제한한다.
    // 테스트·assertion·DB 조건은 생략하지 않으며 동시에 실행하는 JVM 수도 늘리지 않는다.
