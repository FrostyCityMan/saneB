plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.saneb'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('flywayIntegrationTest', Test) {
    description = 'Runs Flyway migration against a real PostgreSQL instance.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/FlywayMigrationIntegrationTest.class'
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/flywayIntegrationTest')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/flywayIntegrationTest')
    shouldRunAfter test
}

tasks.register('authSmokeIntegrationTest', Test) {
    description = 'Runs auth smoke tests against real PostgreSQL with local seed data.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/AuthSmokeIntegrationTest.class'
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/authSmokeIntegrationTest')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/authSmokeIntegrationTest')
    shouldRunAfter flywayIntegrationTest
}

tasks.register('announcementSmokeIntegrationTest', Test) {
    description = 'Runs announcement input smoke tests against real PostgreSQL with local seed data.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/AnnouncementSmokeIntegrationTest.class'
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/announcementSmokeIntegrationTest')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/announcementSmokeIntegrationTest')
    shouldRunAfter flywayIntegrationTest
}
